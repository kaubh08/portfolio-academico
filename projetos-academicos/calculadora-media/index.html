<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Calculadora de Média</h1>
        <p>Informe três notas para calcular a média final e verificar a situação do aluno.</p>

        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1">

        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1">

        <label for="nota3">Nota 3</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1">

        <button onclick="calcularMedia()">Calcular</button>
        <section id="resultado" class="resultado"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
