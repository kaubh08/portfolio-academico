<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora simples de média acadêmica feita com HTML, CSS e JavaScript.">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a href="../../index.html">← Voltar</a>
    </header>

    <main class="container">
        <section class="intro">
            <p class="label">Projeto em JavaScript</p>
            <h1>Calculadora de Média</h1>
            <p>Digite três notas para calcular a média final e verificar a situação do aluno.</p>
        </section>

        <section class="card">
            <div class="field">
                <label for="nota1">Nota 1</label>
                <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0 a 10">
            </div>

            <div class="field">
                <label for="nota2">Nota 2</label>
                <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0 a 10">
            </div>

            <div class="field">
                <label for="nota3">Nota 3</label>
                <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="0 a 10">
            </div>

            <button onclick="calcularMedia()">Calcular</button>

            <div id="resultado" class="resultado">
                Resultado aguardando cálculo.
            </div>
        </section>
    </main>
</body>
<script src="script.js"></script>
</html>
